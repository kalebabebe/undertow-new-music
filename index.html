<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Undertow — New Music</title>
<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f5e6b8;
    --dark: #1a1a2e;
    --dark2: #16213e;
    --dark3: #0f3460;
    --cream: #faf8f0;
    --green: #4a9e6e;
    --yellow: #c9a227;
    --red: #c0504d;
    --gray: #6b7280;
    --light-gray: #e5e7eb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  header {
    background: var(--dark);
    color: var(--cream);
    padding: 1.25rem 1.5rem;
    text-align: center;
  }

  header h1 {
    font-size: 1.5rem;
    letter-spacing: 0.05em;
    margin-bottom: 0.15rem;
  }

  header h1 span { color: var(--gold); }

  header p {
    font-size: 0.85rem;
    opacity: 0.7;
    font-style: italic;
  }

  .container { max-width: 700px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  .tabs {
    display: flex;
    gap: 0;
    margin: 1.5rem 0 1rem;
    border-bottom: 2px solid var(--light-gray);
  }

  .tab {
    padding: 0.7rem 1.2rem;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--gray);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
  }

  .tab:hover { color: var(--dark); }
  .tab.active { color: var(--dark); border-bottom-color: var(--gold); font-weight: 600; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .voter-section {
    background: white;
    border: 1px solid var(--light-gray);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }

  .voter-section label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 0.4rem;
  }

  .voter-section input {
    width: 100%;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--light-gray);
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
  }

  .voter-section input:focus { outline: none; border-color: var(--gold); }

  .song-card {
    background: white;
    border: 1px solid var(--light-gray);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 0.75rem;
    transition: box-shadow 0.2s;
  }

  .song-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .song-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
    gap: 0.5rem;
  }

  .song-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--dark);
  }

  .song-listen {
    font-size: 0.8rem;
    color: var(--dark3);
    text-decoration: none;
    border: 1px solid var(--dark3);
    border-radius: 4px;
    padding: 0.2rem 0.5rem;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .song-listen:hover { background: var(--dark3); color: white; }

  .song-meta {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }

  .badge {
    font-size: 0.75rem;
    padding: 0.2rem 0.55rem;
    border-radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
  }

  .badge-sheet { background: #e8f5e9; color: #2e7d32; }
  .badge-no-sheet { background: #fff3e0; color: #e65100; }
  .badge-unknown-sheet { background: #f5f5f5; color: #757575; }
  .badge-champion { background: #e3f2fd; color: #1565c0; }
  .badge-style { background: #f3e5f5; color: #7b1fa2; }

  .song-note {
    width: 100%;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--light-gray);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.82rem;
    color: var(--dark);
    resize: none;
    height: 2.2rem;
    transition: height 0.15s, border-color 0.15s;
  }

  .song-note:focus { outline: none; border-color: var(--gold); height: 4rem; }
  .song-note::placeholder { color: #b0b0b0; }

  .vote-buttons {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }

  .vote-btn {
    flex: 1;
    padding: 0.55rem 0.5rem;
    border: 2px solid var(--light-gray);
    border-radius: 6px;
    background: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--gray);
    text-align: center;
  }

  .vote-btn:hover { border-color: var(--gold-light); }

  .vote-btn.selected-fav { border-color: var(--gold); background: var(--gold-light); color: #8b6914; }
  .vote-btn.selected-yes { border-color: var(--green); background: #e8f5e9; color: var(--green); }
  .vote-btn.selected-open { border-color: var(--yellow); background: #fff8e1; color: var(--yellow); }
  .vote-btn.selected-no { border-color: var(--red); background: #fbe9e7; color: var(--red); }

  .vote-tally {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--light-gray);
    font-size: 0.78rem;
    color: var(--gray);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .tally-item { display: flex; align-items: center; gap: 0.2rem; }
  .tally-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-fav { background: var(--gold); }
  .dot-yes { background: var(--green); }
  .dot-open { background: var(--yellow); }
  .dot-no { background: var(--red); }

  .submit-section {
    margin-top: 1.5rem;
    text-align: center;
  }

  .submit-btn {
    background: linear-gradient(135deg, var(--dark) 0%, var(--dark3) 100%);
    color: var(--cream);
    border: none;
    padding: 0.85rem 2.5rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: transform 0.1s, box-shadow 0.2s;
  }

  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,26,46,0.3); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .suggest-form {
    background: white;
    border: 1px solid var(--light-gray);
    border-radius: 8px;
    padding: 1.5rem;
  }

  .form-group { margin-bottom: 1rem; }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.35rem;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 0.55rem 0.75rem;
    border: 1px solid var(--light-gray);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
  }

  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { outline: none; border-color: var(--gold); }

  .results-card {
    background: white;
    border: 1px solid var(--light-gray);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .results-rank {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
    min-width: 2rem;
    text-align: center;
  }

  .results-info { flex: 1; }
  .results-title { font-weight: 700; font-size: 1rem; }

  .results-bar {
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 0.4rem;
    background: var(--light-gray);
  }

  .bar-fav { background: var(--gold); }
  .bar-yes { background: var(--green); }
  .bar-open { background: var(--yellow); }
  .bar-no { background: var(--red); }

  .results-votes {
    font-size: 0.8rem;
    color: var(--gray);
    margin-top: 0.25rem;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .tab-hint {
    font-size: 0.84rem;
    color: var(--gray);
    margin-bottom: 1rem;
    line-height: 1.45;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .status-msg {
    text-align: center;
    padding: 1rem;
    border-radius: 8px;
    margin: 1rem 0;
    font-size: 0.95rem;
  }

  .status-success { background: #e8f5e9; color: #2e7d32; }
  .status-error { background: #fbe9e7; color: #c0504d; }

  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
  }

  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 0.8rem;
    color: var(--gray);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.5rem; }
    .vote-btn { font-size: 0.75rem; padding: 0.5rem 0.3rem; }
    .container { padding: 0.75rem 0.75rem 3rem; }
  }
</style>
</head>

<header>
  <h1>Undertow</span></h1>
  <p>New Music</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="switchTab('vote')">Vote</button>
    <button class="tab" onclick="switchTab('suggest')">Suggest a Song</button>
    <button class="tab" onclick="switchTab('results')">Results</button>
  </div>

  <!-- VOTE TAB -->
  <div id="tab-vote" class="tab-content active">
    <p class="tab-hint">Listen to each song, then vote.</p>
    <div class="voter-section">
      <label for="voter-name">Your Name</label>
      <input type="text" id="voter-name" placeholder="So we know who voted" />
    </div>
    <div id="song-list"></div>
    <div class="submit-section">
      <button class="submit-btn" onclick="submitVotes()" id="submit-votes-btn">Submit Votes</button>
    </div>
    <div id="vote-status"></div>
  </div>

  <!-- SUGGEST TAB -->
  <div id="tab-suggest" class="tab-content">
    <p class="tab-hint">Got a song in mind? Add it here and it'll show up for everyone (once Kaleb gets a chance to add it).</p>
    <div class="suggest-form">
      <div class="form-group">
        <label for="suggest-name">Your Name</label>
        <input type="text" id="suggest-name" placeholder="Who's suggesting?" />
      </div>
      <div class="form-group">
        <label for="suggest-song">Song Title</label>
        <input type="text" id="suggest-song" placeholder="Song name" />
      </div>
      <div class="form-group">
        <label for="suggest-artist">Artist / Source</label>
        <input type="text" id="suggest-artist" placeholder="Original artist or where you heard it" />
      </div>
      <div class="form-group">
        <label for="suggest-sheet">Sheet Music Available?</label>
        <select id="suggest-sheet">
          <option value="">Not sure</option>
          <option value="yes">Yes</option>
          <option value="no">No, but learnable by ear</option>
        </select>
      </div>
      <div class="form-group">
        <label for="suggest-champion">Are you willing to champion this?</label>
        <select id="suggest-champion">
          <option value="">Maybe / not sure</option>
          <option value="yes">Yes — I'll bring it to the group</option>
          <option value="no">No — just suggesting, someone else take it</option>
        </select>
      </div>
      <div class="form-group">
        <label for="suggest-link">Link (Spotify, YouTube, etc.)</label>
        <input type="text" id="suggest-link" placeholder="https://..." />
      </div>
      <div class="form-group">
        <label for="suggest-notes">Why this song?</label>
        <textarea id="suggest-notes" placeholder="What makes it a good fit? What's the vibe?"></textarea>
      </div>
      <button class="submit-btn" onclick="submitSuggestion()" style="width:100%;">Submit Suggestion</button>
      <div id="suggest-status"></div>
    </div>
  </div>

  <!-- RESULTS TAB -->
  <div id="tab-results" class="tab-content">
    <p class="tab-hint">Songs ranked by votes. This will be just one input into what we take on.</p>
    <div id="results-list"></div>
  </div>

</div>

<footer>Undertow Brass Band</footer>

    title: 'Never Let You Go',
    artist: 'Third Eye Blind',
    sheet: 'unknown',
    champion: '',
    link: 'https://youtu.be/KIuLB8saO1g?si=APtnciJeLsNcbuEG',
    votes: { yes: 0, open: 0, no: 0 }
  }
];

let currentSongs = [];
let userVotes = {};
let userNotes = {};
let isDemo = !CONFIG.API_URL;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab === 'results') loadResults();
}

function renderSongs(songs) {
  const list = document.getElementById('song-list');
  if (!songs.length) {
    list.innerHTML = '<div class="empty-state"><p>No songs to vote on yet.</p></div>';
    return;
  }

  list.innerHTML = songs.map(song => {
    const sheetBadge = song.sheet === 'yes'
      ? '<span class="badge badge-sheet">Has Sheet Music</span>'
      : song.sheet === 'no'
        ? '<span class="badge badge-no-sheet">By Ear</span>'
        : '<span class="badge badge-unknown-sheet">Sheet TBD</span>';

    const listenLink = song.link
      ? `<a href="${song.link}" target="_blank" rel="noopener" class="song-listen">Listen</a>`
      : '';

    return `
      <div class="song-card" data-id="${song.id}">
        <div class="song-header">
          <div>
            <div class="song-title">${song.title}</div>
            <div style="font-size:0.88rem;color:var(--gray);margin-top:0.15rem;">${song.artist}</div>
          </div>
          ${listenLink}
        </div>
        <div class="song-meta">
          ${sheetBadge}
          ${song.champion ? `<span class="badge badge-champion">Suggested: ${song.champion}</span>` : ''}
        </div>
        <div class="vote-buttons">
          <button class="vote-btn ${userVotes[song.id] === 'fav' ? 'selected-fav' : ''}"
                  onclick="vote(${song.id}, 'fav', this)">
            \u2605 Favorite
          </button>
          <button class="vote-btn ${userVotes[song.id] === 'yes' ? 'selected-yes' : ''}"
                  onclick="vote(${song.id}, 'yes', this)">
            Let's do it
          </button>
          <button class="vote-btn ${userVotes[song.id] === 'open' ? 'selected-open' : ''}"
                  onclick="vote(${song.id}, 'open', this)">
            I'm open to it
          </button>
          <button class="vote-btn ${userVotes[song.id] === 'no' ? 'selected-no' : ''}"
                  onclick="vote(${song.id}, 'no', this)">
            Not for me
          </button>
        </div>
        <textarea class="song-note" data-song-id="${song.id}"
                  placeholder="Any thoughts on this one?"
                  oninput="userNotes[${song.id}]=this.value">${userNotes[song.id] || ''}</textarea>
        ${song.votes && ((song.votes.fav || 0) + song.votes.yes + song.votes.open + song.votes.no > 0) ? `
          <div class="vote-tally">
            <span class="tally-item"><span class="tally-dot dot-fav"></span> ${song.votes.fav || 0}</span>
            <span class="tally-item"><span class="tally-dot dot-yes"></span> ${song.votes.yes}</span>
            <span class="tally-item"><span class="tally-dot dot-open"></span> ${song.votes.open}</span>
            <span class="tally-item"><span class="tally-dot dot-no"></span> ${song.votes.no}</span>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

function vote(songId, value, btn) {
  userVotes[songId] = value;
  const card = btn.closest('.song-card');
  card.querySelectorAll('.vote-btn').forEach(b => {
    b.classList.remove('selected-fav', 'selected-yes', 'selected-open', 'selected-no');
  });
  btn.classList.add(`selected-${value}`);
}

async function submitVotes() {
  const name = document.getElementById('voter-name').value.trim();
  if (!name) {
    showStatus('vote-status', 'Please enter your name above.', 'error');
    return;
  }
  const votedSongs = Object.keys(userVotes);
  if (!votedSongs.length) {
    showStatus('vote-status', 'Vote on at least one song before submitting.', 'error');
    return;
  }

  if (isDemo) {
    showStatus('vote-status', 'Demo mode — votes recorded locally. Connect to Google Sheets to save for real!', 'success');
    return;
  }

  const btn = document.getElementById('submit-votes-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const result = await postToAPI({ action: 'vote', voter: name, votes: userVotes, notes: userNotes });
    if (result.success) {
      showStatus('vote-status', 'Votes submitted — thank you, ' + name + '!', 'success');
      userVotes = {};
    } else {
      showStatus('vote-status', 'Something went wrong. Try again?', 'error');
    }
  } catch (e) {
    showStatus('vote-status', 'Took longer than expected — your votes may still have been saved. Check the Results tab in a moment.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Submit Votes';
}

async function submitSuggestion() {
  const name = document.getElementById('suggest-name').value.trim();
  const song = document.getElementById('suggest-song').value.trim();
  if (!name || !song) {
    showStatus('suggest-status', 'Please fill in your name and the song title.', 'error');
    return;
  }

  const data = {
    action: 'suggest',
    suggestor: name,
    song: song,
    artist: document.getElementById('suggest-artist').value.trim(),
    sheet: document.getElementById('suggest-sheet').value,
    champion: document.getElementById('suggest-champion').value,
    link: document.getElementById('suggest-link').value.trim(),
    notes: document.getElementById('suggest-notes').value.trim()
  };

  if (isDemo) {
    showStatus('suggest-status', 'Demo mode — suggestion noted locally. Connect to Google Sheets to save for real!', 'success');
    currentSongs.push({
      id: Date.now(),
      title: data.song,
      artist: data.artist,
      sheet: data.sheet || 'unknown',
      champion: data.champion === 'yes' ? data.suggestor : '',
      link: data.link,
      votes: { yes: 0, open: 0, no: 0 }
    });
    ['suggest-song','suggest-artist','suggest-link','suggest-notes'].forEach(id =>
      document.getElementById(id).value = '');
    document.getElementById('suggest-sheet').selectedIndex = 0;
    document.getElementById('suggest-champion').selectedIndex = 0;
    return;
  }

  try {
    const result = await postToAPI(data);
    if (result.success) {
      showStatus('suggest-status', 'Song suggested — nice pick, ' + name + '!', 'success');
      ['suggest-song','suggest-artist','suggest-link','suggest-notes'].forEach(id =>
        document.getElementById(id).value = '');
    } else {
      showStatus('suggest-status', 'Something went wrong. Try again?', 'error');
    }
  } catch (e) {
    showStatus('suggest-status', 'Took longer than expected — your suggestion may still have been saved.', 'error');
  }
}

function loadResults() {
  // Show current data immediately, then refresh from API
  renderResults(currentSongs);
  if (!isDemo) {
    fetchFromAPI('results')
      .then(function(data) {
        if (data.success && data.songs && data.songs.length > 0) {
          currentSongs = data.songs;
        }
        renderResults(currentSongs);
      })
      .catch(function() {
        renderResults(currentSongs);
      });
  }
}

function renderResults(songs) {
  const sorted = [...songs].sort((a, b) => {
    const scoreA = (a.votes?.fav || 0) * 5 + (a.votes?.yes || 0) * 3 + (a.votes?.open || 0) - (a.votes?.no || 0);
    const scoreB = (b.votes?.fav || 0) * 5 + (b.votes?.yes || 0) * 3 + (b.votes?.open || 0) - (b.votes?.no || 0);
    return scoreB - scoreA;
  });
  const list = document.getElementById('results-list');
  if (!sorted.length) {
    list.innerHTML = '<div class="empty-state"><p>No votes yet.</p></div>';
    return;
  }
  list.innerHTML = sorted.map((song, i) => {
    const total = (song.votes?.fav || 0) + (song.votes?.yes || 0) + (song.votes?.open || 0) + (song.votes?.no || 0);
    const pctFav = total ? (((song.votes?.fav || 0) / total) * 100) : 0;
    const pctYes = total ? ((song.votes.yes / total) * 100) : 0;
    const pctOpen = total ? ((song.votes.open / total) * 100) : 0;
    const pctNo = total ? ((song.votes.no / total) * 100) : 0;
    return `
      <div class="results-card">
        <div class="results-rank">${i + 1}</div>
        <div class="results-info">
          <div class="results-title">${song.title}</div>
          <div style="font-size:0.82rem;color:var(--gray);">${song.artist}</div>
          <div class="results-bar">
            <div class="bar-fav" style="width:${pctFav}%"></div>
            <div class="bar-yes" style="width:${pctYes}%"></div>
            <div class="bar-open" style="width:${pctOpen}%"></div>
            <div class="bar-no" style="width:${pctNo}%"></div>
          </div>
          <div class="results-votes">
            ${song.votes?.fav || 0} fav · ${song.votes?.yes || 0} yes · ${song.votes?.open || 0} open · ${song.votes?.no || 0} no
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// All communication with Google Apps Script uses JSONP (script tag injection)
// to avoid CORS issues with Apps Script's 302 redirects.
function callAPI(action, payload) {
  return new Promise(function(resolve, reject) {
    var callbackName = 'gasCallback_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
    var script = document.createElement('script');
    var timeout = setTimeout(function() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Request timed out'));
    }, 30000);

    window[callbackName] = function(data) {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };

    var url = CONFIG.API_URL + '?action=' + action + '&callback=' + callbackName;
    if (payload) {
      url += '&payload=' + encodeURIComponent(JSON.stringify(payload));
    }
    script.src = url;
    script.onerror = function() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Failed to load'));
    };
    document.head.appendChild(script);
  });
}

function postToAPI(data) { return callAPI(data.action, data); }
function fetchFromAPI(action) { return callAPI(action); }

function showStatus(elementId, message, type) {
  const el = document.getElementById(elementId);
  el.innerHTML = `<div class="status-msg status-${type}">${message}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, 5000);
}

async function init() {
  // Google Sheet is the source of truth for songs.
  // FALLBACK_SONGS is used only if the API is unreachable.
  if (CONFIG.API_URL) {
    try {
      var data = await fetchFromAPI('songs');
      if (data.success && data.songs && data.songs.length > 0) {
        currentSongs = data.songs;
      } else {
        currentSongs = FALLBACK_SONGS.map(function(s) {
          return Object.assign({}, s, { votes: { fav: 0, yes: 0, open: 0, no: 0 } });
        });
      }
    } catch (e) {
      currentSongs = FALLBACK_SONGS.map(function(s) {
        return Object.assign({}, s, { votes: { fav: 0, yes: 0, open: 0, no: 0 } });
      });
    }
  } else {
    currentSongs = FALLBACK_SONGS.map(function(s) {
      return Object.assign({}, s, { votes: { fav: 0, yes: 0, open: 0, no: 0 } });
    });
  }
  renderSongs(currentSongs);
}

init();
</script>
</body>
